[package]
name = "sweetgreen-rs"
version = "0.1.0"
edition = "2024"
description = "Unofficial Sweetgreen cart management crate + CLI"
license = "MIT"

[lib]
name = "sweetgreen_rs"
path = "src/lib.rs"

[[bin]]
name = "sg"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
cookie_store = "0.22"
directories = "5.0"
regex = "1.11"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2", "cookies", "gzip", "brotli", "deflate", "zstd"] }
reqwest_cookie_store = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.42", features = ["rt-multi-thread", "macros"] }
url = "2.5"
uuid = { version = "1.11", features = ["v4"] }

[dev-dependencies]
tempfile = "3.15"
